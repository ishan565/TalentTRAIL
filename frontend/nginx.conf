server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api calls to the backend container so the browser never
    # makes a cross-origin request (no CORS config needed in production).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # LLM calls can take a while
    }

    # Health-check endpoint used by load-balancers / cloud platforms.
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # SPA fallback: every route serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
